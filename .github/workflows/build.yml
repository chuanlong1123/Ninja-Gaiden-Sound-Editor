
name: Build NG Sound Editor APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: android-actions/setup-android@v3      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir android-src
          unzip NGSoundEditorAndroid-prototype-v3.8.zip -d android-src

      - name: Run tests
        working-directory: android-src
        run: gradle --no-daemon testDebugUnitTest

      - name: Build APK
        working-directory: android-src
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NG-Sound-Editor-Android
          path: android-src/app/build/outputs/apk/debug/app-debug.apk
          
