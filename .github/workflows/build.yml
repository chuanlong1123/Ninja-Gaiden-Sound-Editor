name: Build NG Sound Editor APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Android project
        run: |
          mkdir -p app/src/main/java/com/ngsoundeditor/android
          mkdir -p app/src/test/java/com/ngsoundeditor/android

          cp MainActivity.kt app/src/main/java/com/ngsoundeditor/android/
          cp SoundParser.kt app/src/main/java/com/ngsoundeditor/android/
          cp SoundParserTest.kt app/src/test/java/com/ngsoundeditor/android/
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp build.gradle.kts app/build.gradle.kts

          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/ngsoundeditor/android/MainActivity.kt")
          s = p.read_text()
          n = s.count('type = "audio/wav"')
          if n == 0:
              print("No strict audio/wav filter found; source may already be fixed.")
          else:
              s = s.replace('type = "audio/wav"', 'type = "*/*"')
              p.write_text(s)
              print(f"Fixed {n} WAV picker filter(s).")
          PY

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.6.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
          }
          EOF

          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Run tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NG-Sound-Editor-Android
          path: app/build/outputs/apk/debug/app-debug.apk